{{define "paste.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste {{.PasteID}} - TempFiles</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link rel="stylesheet" href="/static/css/style.css">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
</head>
<body data-theme="{{.Theme}}">
    <button class="theme-toggle" title="Toggle theme">🌙</button>
    <div class="container">
        <div class="fade-in">
            <div class="header">
                <div class="logo">📝 Paste</div>
                <div class="subtitle">Expires in {{.ExpiresIn}}</div>
            </div>

            <!-- Share Link Section -->
            <div class="download-section">
                <h3 style="margin-bottom: 1rem;">🔗 Share Link</h3>
                <div class="download-link">{{.PasteRawURL}}</div>
                <div style="margin-top: 1rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                    <a href="{{.PasteRawURL}}" class="btn" target="_blank">
                        📄 View Raw
                    </a>
                    <a href="{{.PasteRawURL}}" class="btn" download="{{.PasteID}}.txt">
                        📥 Download Raw
                    </a>
                    <button class="btn copy-btn" data-text="{{.PasteRawURL}}">
                        📋 Copy Link
                    </button>
                </div>
            </div>

            <!-- Countdown Timer -->
            <div class="countdown" data-expiry="{{.ExpiresAt}}">
                <div style="margin-bottom: 0.5rem;">⏰ Time Remaining</div>
                <div class="countdown-time">Loading...</div>
            </div>

            <!-- Paste Content -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                    <h3 style="margin: 0;">📝 Content</h3>
                    <button class="btn btn-secondary copy-btn" id="pasteCopyContentBtn" data-content-id="pasteContent">
                        📋 Copy Content
                    </button>
                </div>
                <pre id="pasteContent" class="paste-content"><code>{{.PasteContent}}</code></pre>
            </div>

            <!-- Actions -->
            <div class="card">
                <div style="text-align: center;">
                    <a href="/" class="btn btn-secondary">
                        📁 New Paste / Upload
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/paste.js" defer></script>
</body>
</html>
{{end}}
